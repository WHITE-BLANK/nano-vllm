# 使用pytorch2.7+cu128 python3.12 对应的flash-attn.wheel

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.7,<2.8",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn",
    "xxhash",
]

[project.urls]
Homepage="https://github.com/GeeeekExplorer/nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]

# 1. 声明 PyTorch 官方的 cu128 源
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true  # 仅针对明确指定的包使用该源，避免污染其他依赖

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
flash-attn = { path = "wheels/flash_attn-2.8.0.post2-cp312-cp312-linux_x86_64.whl" }